name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codebrain
          POSTGRES_PASSWORD: codebrain
          POSTGRES_DB: codebrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codebrain"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CODEBRAIN_DATABASE_URL: postgresql://codebrain:codebrain@localhost:5432/codebrain
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run codebrain migrate
      - run: uv run pytest -v
