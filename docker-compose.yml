services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codebrain
      POSTGRES_PASSWORD: codebrain
      POSTGRES_DB: codebrain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebrain"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
